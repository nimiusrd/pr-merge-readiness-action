name: PR Merge Readiness
description: PR の変更履歴に基づく追加確認を判定し、ラベルと実行サマリーを更新します。
author: nimiusrd
inputs:
  config-path:
    description: default branch 上の設定ファイル
    default: .github/pr-merge-readiness.toml
  token:
    description: contents の read、pull-requests・issues の write 権限を持つ token
    default: ${{ github.token }}
outputs:
  operation:
    description: イベントから選択した処理（observe、validate-config、skip）
    value: ${{ steps.run.outputs.operation }}
  config-sha:
    description: 使用した設定コミット
    value: ${{ steps.run.outputs.config-sha }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        PMR_ROOT: ${{ github.action_path }}
        PMR_SOURCE_REF: ${{ github.action_ref }}
        PMR_SOURCE_REPOSITORY: ${{ github.action_repository }}
        PMR_CONFIG_PATH: ${{ inputs.config-path }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$PMR_ROOT/run-binary.sh" action
