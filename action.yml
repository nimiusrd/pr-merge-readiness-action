name: PR Merge Readiness
description: PR の変更履歴に基づく追加確認を判定し、ラベルと実行サマリーを更新します。
author: nimiusrd
inputs:
  config-path:
    description: default branch 上の設定ファイル
    default: .github/pr-merge-readiness.toml
  token:
    description: contents の read、pull-requests・issues の write 権限を持つ token
    default: ${{ github.token }}
outputs:
  operation:
    description: イベントから選択した処理（observe、validate-config、skip）
  config-sha:
    description: 使用した設定コミット
runs:
  using: node24
  main: dist/index.js
