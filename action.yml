name: PR Merge Readiness
description: Observe PR metadata and publish reference Checks or manually requested labels.
author: nimiusrd
inputs:
  operation:
    description: run (automatic flow), prepare, validate-config, observe, publish-checks, or publish-labels
    default: run
  action-ref:
    description: Full source commit SHA; defaults to the actual pinned Action reference
  config-path:
    description: Configuration path on the trusted default branch
    default: .github/pr-merge-readiness.toml
  config-sha:
    description: Configuration commit; required for validate-config and publication, forbidden for prepare
  repository:
    description: Target owner/repository (must match the workflow context)
    default: ${{ github.repository }}
  pr-number:
    description: Optional PR number for manual observation only
  event-path:
    description: Event JSON for observe (defaults to GITHUB_EVENT_PATH)
  report-dir:
    description: Report directory for observe and publication
  artifact-name:
    description: pr-merge-readiness-RUN_ID-RUN_ATTEMPT
  token:
    description: Token scoped to the operation
    default: ${{ github.token }}
outputs:
  operation:
    description: Operation selected by run or prepare (validate-config, observe or skip)
    value: ${{ steps.run.outputs.operation }}
  checks:
    description: Whether Check publication is enabled (run or prepare)
    value: ${{ steps.run.outputs.checks }}
  labels:
    description: Whether the event explicitly requests labels (run or prepare)
    value: ${{ steps.run.outputs.labels }}
  pr-number:
    description: Validated manual PR selection (run or prepare)
    value: ${{ steps.run.outputs.pr-number }}
  config-sha:
    description: Trusted configuration commit
    value: ${{ steps.run.outputs.config-sha }}
  report-dir:
    description: Absolute report directory
    value: ${{ steps.run.outputs.report-dir }}
  manifest:
    description: Manifest path
    value: ${{ steps.run.outputs.manifest }}
  artifact-name:
    description: Artifact name for this run and attempt
    value: ${{ steps.run.outputs.artifact-name }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: '0.12.13'
        python-version: '3.14'
        enable-cache: false
    - shell: bash
      run: env -u UV_CONFIG_FILE -u UV_PROJECT -u UV_PYTHON uv python install --no-config 3.14
    - id: run
      shell: bash
      env:
        PMR_ROOT: ${{ github.action_path }}
        PMR_SOURCE_REF: ${{ github.action_ref }}
        PMR_SOURCE_REPOSITORY: ${{ github.action_repository }}
        PMR_OPERATION: ${{ inputs.operation }}
        PMR_ACTION_REF: ${{ inputs.action-ref }}
        PMR_CONFIG_PATH: ${{ inputs.config-path }}
        PMR_CONFIG_SHA: ${{ inputs.config-sha }}
        PMR_REPOSITORY: ${{ inputs.repository }}
        PMR_PR_NUMBER: ${{ inputs.pr-number }}
        PMR_EVENT_PATH: ${{ inputs.event-path }}
        PMR_REPORT_DIR: ${{ inputs.report-dir }}
        PMR_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$PMR_ROOT/run.sh" action

    - id: preparation
      name: Save preparation failure
      if: ${{ failure() && inputs.operation == 'run' && steps.run.outcome == 'failure' && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pr-merge-readiness-preparation-${{ github.run_id }}-${{ github.run_attempt }}
        path: preparation-report/
        if-no-files-found: error
        retention-days: 30
    - id: execute
      name: Observe
      if: inputs.operation == 'run' && steps.run.outputs.operation == 'observe'
      shell: bash
      env:
        PMR_ROOT: ${{ github.action_path }}
        PMR_SOURCE_REF: ${{ github.action_ref }}
        PMR_SOURCE_REPOSITORY: ${{ github.action_repository }}
        PMR_OPERATION: ${{ steps.run.outputs.operation }}
        PMR_ACTION_REF: ${{ inputs.action-ref }}
        PMR_CONFIG_PATH: ${{ inputs.config-path }}
        PMR_CONFIG_SHA: ${{ steps.run.outputs.config-sha }}
        PMR_REPOSITORY: ${{ inputs.repository }}
        PMR_REPORT_DIR: ${{ steps.run.outputs.report-dir }}
        PMR_ARTIFACT_NAME: ${{ steps.run.outputs.artifact-name }}
        GH_TOKEN: ${{ inputs.token }}
        PMR_PR_NUMBER: ${{ steps.run.outputs.pr-number }}
        PMR_EVENT_PATH: ''
      run: bash "$PMR_ROOT/run.sh" action
    - id: observations
      name: Save observations
      if: ${{ always() && inputs.operation == 'run' && steps.run.outputs.operation == 'observe' && (steps.execute.outcome == 'success' || steps.execute.outcome == 'failure') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.run.outputs.artifact-name }}
        path: ${{ steps.run.outputs.report-dir }}
        if-no-files-found: error
        retention-days: 30
    - id: checks
      name: Publish Checks
      if: ${{ !cancelled() && inputs.operation == 'run' && steps.run.outcome == 'success' && steps.observations.outcome == 'success' && steps.run.outputs.checks == 'true' }}
      shell: bash
      env:
        PMR_ROOT: ${{ github.action_path }}
        PMR_SOURCE_REF: ${{ github.action_ref }}
        PMR_SOURCE_REPOSITORY: ${{ github.action_repository }}
        PMR_OPERATION: publish-checks
        PMR_PR_NUMBER: ''
        PMR_EVENT_PATH: ''
        PMR_ACTION_REF: ${{ inputs.action-ref }}
        PMR_CONFIG_PATH: ${{ inputs.config-path }}
        PMR_CONFIG_SHA: ${{ steps.run.outputs.config-sha }}
        PMR_REPOSITORY: ${{ inputs.repository }}
        PMR_REPORT_DIR: ${{ steps.run.outputs.report-dir }}
        PMR_ARTIFACT_NAME: ${{ steps.run.outputs.artifact-name }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$PMR_ROOT/run.sh" action
    - id: labels
      name: Publish manually requested labels
      if: ${{ !cancelled() && inputs.operation == 'run' && steps.run.outcome == 'success' && steps.observations.outcome == 'success' && steps.run.outputs.labels == 'true' && ((steps.run.outputs.checks == 'true' && steps.checks.outcome == 'success') || (steps.run.outputs.checks == 'false' && steps.checks.outcome == 'skipped')) }}
      shell: bash
      env:
        PMR_ROOT: ${{ github.action_path }}
        PMR_SOURCE_REF: ${{ github.action_ref }}
        PMR_SOURCE_REPOSITORY: ${{ github.action_repository }}
        PMR_OPERATION: publish-labels
        PMR_PR_NUMBER: ''
        PMR_EVENT_PATH: ''
        PMR_ACTION_REF: ${{ inputs.action-ref }}
        PMR_CONFIG_PATH: ${{ inputs.config-path }}
        PMR_CONFIG_SHA: ${{ steps.run.outputs.config-sha }}
        PMR_REPOSITORY: ${{ inputs.repository }}
        PMR_REPORT_DIR: ${{ steps.run.outputs.report-dir }}
        PMR_ARTIFACT_NAME: ${{ steps.run.outputs.artifact-name }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$PMR_ROOT/run.sh" action
