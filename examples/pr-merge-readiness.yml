# uses と TOML の action_ref を同じ40桁 SHA に固定します。
# この起動条件への移行時は、新実装の公開後に両方の SHA を更新してください。
name: PR Merge Readiness

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number (empty = all open PRs)
        type: string
        default: ''
      update-labels:
        description: Update labels for all open PRs
        type: boolean
        default: false
  push:
    paths: [.github/pr-merge-readiness.toml, .github/workflows/pr-merge-readiness.yml]

permissions: {}

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: autonomous-merge-check-writer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write
    steps:
      - uses: nimiusrd/pr-merge-readiness-action@27ca8908b993e93eb319c70e7231fa7fd1999b05
