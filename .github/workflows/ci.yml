name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:workflows
  bundle:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Test committed distribution before building
        shell: bash
        run: |
          if [[ -d dist ]]; then
            npm run check:dist
            PMR_TEST_BUNDLE=dist/index.js node --import tsx --test tests/bundle.test.ts
          fi
      - run: npm run build
      - run: npm run check:dist -- build/dist
      - run: npm run test:bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: action-bundle
          path: build/dist/
          if-no-files-found: error
          retention-days: 7
