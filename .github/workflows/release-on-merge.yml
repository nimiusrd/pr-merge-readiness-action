name: Release on merge
on:
  push:
    branches: [main]
permissions:
  actions: write
  contents: read
  pull-requests: read
concurrency:
  group: release-on-merge
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Dispatch release for merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dispatch_release.py
