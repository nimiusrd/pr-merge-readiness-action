name: Validate Readiness Configuration
on:
  workflow_call:
    inputs:
      config-path:
        type: string
        required: true
      output-path:
        type: string
        required: true
      action-ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .readiness-action
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          python-version: '3.14'
          enable-cache: false
      - run: uv python install --no-config 3.14
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proposed
          persist-credentials: false
      - name: Validate proposed data without executing repository code
        working-directory: proposed
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          OUTPUT_PATH: ${{ inputs.output-path }}
          ACTION_REF: ${{ inputs.action-ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          test "$ACTION_REF" = "$WORKFLOW_SHA"
          bash ../.readiness-action/run.sh generate-workflow --config "$CONFIG_PATH" --output "$OUTPUT_PATH" --check
