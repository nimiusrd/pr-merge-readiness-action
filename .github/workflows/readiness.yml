name: PR Merge Readiness Runtime

on:
  workflow_call:
    inputs:
      config-path:
        type: string
        required: true
      action-ref:
        type: string
        required: true
      pr-number:
        type: string
        default: ''
      update-labels:
        type: boolean
        default: false

permissions:
  contents: read

# ラベル更新全体を単一 writer にする。他の run は同じキューを共有しない。
concurrency:
  group: ${{ inputs.update-labels && 'autonomous-merge-labels' || format('readiness-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      config-sha: ${{ steps.prepare.outputs.config-sha }}
      operation: ${{ steps.prepare.outputs.operation }}
      checks: ${{ steps.prepare.outputs.checks }}
      labels: ${{ steps.prepare.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .readiness-action
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          python-version: '3.14'
          enable-cache: false
      - run: uv python install --no-config 3.14
      - id: prepare
        env:
          PMR_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PMR_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          PMR_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          GH_TOKEN: ${{ github.token }}
          CONFIG_PATH: ${{ inputs.config-path }}
          ACTION_REF: ${{ inputs.action-ref }}
          PR_NUMBER: ${{ inputs.pr-number }}
          UPDATE_LABELS: ${{ inputs.update-labels }}
        run: >-
          bash .readiness-action/run.sh prepare
          --config-path "$CONFIG_PATH" --action-ref "$ACTION_REF"
          --pr-number "$PR_NUMBER" --update-labels "$UPDATE_LABELS"
      - name: Save preparation failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-merge-readiness-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: preparation-report/
          if-no-files-found: error
          retention-days: 30

  mark:
    needs: prepare
    if: needs.prepare.outputs.operation == 'mark'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: autonomous-merge-check-writer
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .readiness-action
          persist-credentials: false
      - uses: ./.readiness-action
        env:
          PMR_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PMR_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          PMR_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        with:
          operation: mark
          action-ref: ${{ inputs.action-ref }}
          config-path: ${{ inputs.config-path }}
          config-sha: ${{ needs.prepare.outputs.config-sha }}

  observe:
    needs: prepare
    if: needs.prepare.outputs.operation == 'observe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .readiness-action
          persist-credentials: false
      - uses: ./.readiness-action
        env:
          PMR_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PMR_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          PMR_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        with:
          operation: observe
          action-ref: ${{ inputs.action-ref }}
          config-path: ${{ inputs.config-path }}
          config-sha: ${{ needs.prepare.outputs.config-sha }}
          pr-number: ${{ inputs.pr-number }}
          report-dir: readiness-report
          artifact-name: pr-merge-readiness-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save this attempt's observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-merge-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness-report/
          if-no-files-found: error
          retention-days: 30

  publish-checks:
    needs: [prepare, observe]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.checks == 'true' && (needs.observe.result == 'success' || needs.observe.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: autonomous-merge-check-writer
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .readiness-action
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pr-merge-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness-report
      - uses: ./.readiness-action
        env:
          PMR_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PMR_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          PMR_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        with:
          operation: publish-checks
          action-ref: ${{ inputs.action-ref }}
          config-path: ${{ inputs.config-path }}
          config-sha: ${{ needs.prepare.outputs.config-sha }}
          report-dir: readiness-report
          artifact-name: pr-merge-readiness-${{ github.run_id }}-${{ github.run_attempt }}

  publish-labels:
    needs: [prepare, observe, publish-checks]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.labels == 'true' && (needs.observe.result == 'success' || needs.observe.result == 'failure') && ((needs.prepare.outputs.checks == 'true' && needs.publish-checks.result == 'success') || (needs.prepare.outputs.checks == 'false' && needs.publish-checks.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .readiness-action
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pr-merge-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness-report
      - uses: ./.readiness-action
        env:
          PMR_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PMR_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          PMR_WORKFLOW_PATH: ${{ job.workflow_file_path }}
        with:
          operation: publish-labels
          action-ref: ${{ inputs.action-ref }}
          config-path: ${{ inputs.config-path }}
          config-sha: ${{ needs.prepare.outputs.config-sha }}
          report-dir: readiness-report
          artifact-name: pr-merge-readiness-${{ github.run_id }}-${{ github.run_attempt }}
