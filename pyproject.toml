[project]
name = "pr-merge-readiness"
version = "0.1.0"
requires-python = ">=3.11"
description = "Metadata-only pull request readiness observations"
license = "MIT"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"cli.py" = ["E402"]
"scripts/check_workflows.py" = ["E402"]
