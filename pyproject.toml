[project]
name = "pr-merge-readiness"
version = "0.3.0"
requires-python = ">=3.14"
description = "Metadata-only pull request readiness observations"
license = "MIT"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15.7", "mypy>=1.19", "PyYAML>=6.0.3", "types-PyYAML>=6.0.12"]

[tool.uv]
required-version = "==0.12.13"
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.14"
files = ["pr_merge_readiness", "cli.py", "scripts"]
strict = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"cli.py" = ["E402"]
"scripts/check_workflows.py" = ["E402"]
